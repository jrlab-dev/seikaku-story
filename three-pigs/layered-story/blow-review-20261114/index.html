<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>息を吹く場面の見直し</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f0e5;color:#30281e;font-family:system-ui,sans-serif}main{max-width:820px;margin:auto;padding:24px 16px}h1{font-size:24px}p{line-height:1.7}video{width:100%;background:#201c17;border-radius:12px}nav{display:flex;gap:10px;margin:16px 0}button{flex:1;min-height:48px;border:2px solid #796145;border-radius:10px;background:white;color:#44331e;font:inherit;font-weight:700}button[aria-pressed=true]{background:#594329;color:white}#caption{min-height:5em;font-size:18px;padding:12px 0}small{display:block;line-height:1.6}a{color:#65451e}</style><main><h1>息を吹く場面の見直し</h1><p>約16秒。同じ音声で、現行版と修正版を見比べられます。</p><nav aria-label="映像を選択"><button data-kind="after" aria-pressed="true">修正版を再生</button><button data-kind="before" aria-pressed="false">現行版を再生</button></nav><video controls playsinline preload="metadata" poster="poster.jpg" src="after.mp4"></video><div id="caption"></div><small>修正版：狼が息を吹く姿 → 風が家に届く全景 → 家の崩壊。<br>今回は息を吹く場面の比較です。歩行の修正と本編への反映は含みません。</small><p><a href="../">現在の本編へ</a></p></main><script>const cues=[{"start": 0.10999999999999943, "end": 2.9000000000000057, "text": "それなら、吹き飛ばしてやる！"}, {"start": 3.160000000000011, "end": 4.510000000000005, "text": "ふうーっ！"}, {"start": 5.310000000000002, "end": 11.490000000000009, "text": "おおかみが息を吹きつけると、わらの家は、ひとたまりもありません。"}, {"start": 11.760000000000005, "end": 13.180000000000007, "text": "わあっ！"}, {"start": 13.330000000000013, "end": 18.27000000000001, "text": "長男は大急ぎで、次男の木の家へ逃げました。"}];const v=document.querySelector('video'),cap=document.querySelector('#caption');document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{v.pause();v.src=b.dataset.kind+'.mp4';cap.textContent='';document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));v.play().catch(()=>{cap.textContent='映像の再生ボタンを押してください。'});}));v.addEventListener('timeupdate',()=>{cap.textContent=cues.find(c=>v.currentTime>=c.start&&v.currentTime<c.end)?.text||'';});</script></html>
