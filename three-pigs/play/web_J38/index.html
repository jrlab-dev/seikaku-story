<script type="module">
import {TYPE_NAMES,PROFILE_TEXT} from './personality_text.mjs';
import {castTypes} from './animal_reactions.js';
const START=41,TOTAL=330*2**20,$=id=>document.getElementById(id);
const q=(new URLSearchParams(location.search).get('cast')||'33535,55331,33333,11311').split(','),ROLES=['pig_straw','pig_wood','pig_brick','wolf'],LABEL={pig_straw:'長男',pig_wood:'次男',pig_brick:'三男',wolf:'おおかみ'};
const cast=Object.fromEntries(ROLES.map((r,i)=>[r,q[i]])),types=castTypes(cast),man=await (await fetch('./assets/portraits/manifest.json')).json();
const imgs={};await Promise.all(ROLES.map(r=>new Promise(ok=>{const im=new Image();im.onload=ok;im.onerror=ok;im.src=man[r].url;imgs[r]=im;})));
const pages=[{img:'home',txt:'3びきのこぶたは、小さな家で暮らしていました。<br>大きくなった3びきは、自分たちの家を作ることに。'},...ROLES.slice(0,3).map(r=>({role:r})),{img:'arrive',txt:'新しい土地に到着。<br>ふり返ると、前の家が遠くに。'},{role:'wolf',pre:'そのころ、おおかみは……'},{end:true}];
let n=0,anim=null,ready=false,phase='read';
function card(r){const code=cast[r],t=PROFILE_TEXT[code]?.pages??[],c=document.createElement('canvas');c.width=240;c.height=300;
 const fr=man[r].frames.filter(f=>f.type===(types[r]??9)),draw=k=>{const f=fr[k%fr.length],[x,y,w,h]=f.rect,s=Math.min(230/w,290/h),ctx=c.getContext('2d');ctx.clearRect(0,0,240,300);ctx.drawImage(imgs[r],x,y,w,h,120-w*s/2,298-h*s,w*s,h*s);};
 let k=0;draw(0);anim=setInterval(()=>draw(++k),500);
 const d=document.createElement('div');d.className='card';d.append(c);const b=document.createElement('div');b.innerHTML=`<div class="role">${LABEL[r]}</div><div class="name">${TYPE_NAMES[code]??''}</div><div class="lines">${t.map(p=>p.join('')).join('<br>')}</div>`;d.append(b);return d;}
function show(){clearInterval(anim);const p=pages[n],box=$('pro');box.innerHTML='';
 if(n===0){const h=document.createElement('h2');h.textContent='三びきのこぶた';box.append(h);}
 if(p.img){const im=document.createElement('img');im.className='scene';im.src='./assets/prologue/'+p.img+'.jpg';box.append(im);const t=document.createElement('div');t.className='txt';t.innerHTML=p.txt;box.append(t);}
 if(p.pre){const t=document.createElement('div');t.className='sub';t.textContent=p.pre;t.style.marginBottom='8px';box.append(t);}
 if(p.role){if(!p.pre){const t=document.createElement('div');t.className='sub';t.textContent='性格のお話';t.style.marginBottom='8px';box.append(t);}box.append(card(p.role));}
 if(p.end){const t=document.createElement('div');t.className='txt';t.innerHTML=ready?'準備ができました。':'もう少しで準備ができます…';box.append(t);const s=document.createElement('div');s.className='sub';s.textContent='どんなお話になるかな？';box.append(s);}
 const nav=document.createElement('div');nav.className='nav';
 if(n>0){const bk=document.createElement('button');bk.className='back';bk.textContent='もどる';bk.onclick=()=>{n--;show();};nav.append(bk);}
 const go=document.createElement('button');if(p.end){go.className='go';go.id='cover-go';go.textContent='▶ お話をはじめる';go.disabled=!ready;go.onclick=start;}else{go.textContent='つぎへ';go.onclick=()=>{n++;show();};}nav.append(go);box.append(nav);
 const dots=document.createElement('div');dots.className='dots';dots.textContent=pages.map((_,i)=>i===n?'●':'○').join('');box.append(dots);}
function start(){phase='wait';const r=$('story-time');r.value=START;r.dispatchEvent(new Event('input'));$('story-play').click();$('pro').innerHTML='<div class="txt" style="margin-top:30vh">はじまります…</div>';}// 音を鳴らすため、押した操作の中で再生する
function tick(){const mb=performance.getEntriesByType('resource').reduce((s,e)=>s+(e.transferSize||e.encodedBodySize||0),0);$('cover-bar').style.width=Math.min(98,mb/TOTAL*100).toFixed(0)+'%';
 const play=$('story-play'),pause=$('story-pause'),r=$('story-time');
 // 読んでいるあいだに、3Dの物語の準備まで済ませる（再生を押して、始まったらすぐ紹介のあとの位置で止める）
 if(phase==='read'&&play&&!play.disabled&&!window.__pre&&window.__prepareStory){window.__pre=1;window.__prepareStory()?.then(()=>{window.__pre=2;ready=true;if(pages[n].end)show();});}
 $('cover-mb').textContent=(ready?'準備ができました（':'3Dの絵本劇を読み込んでいます… （')+Math.round(mb/2**20)+' MB）';if(ready)$('cover-bar').style.width='100%';
 if(phase==='wait'&&+r.value>=START&&pause&&!pause.disabled){phase='on';$('cover').hidden=true;}
 if(phase==='on'&&+r.value>=+r.max-.2){phase='end';const c=$('cover');c.hidden=false;$('pro').innerHTML='<h2 style="margin-top:20vh">おしまい</h2><p>性格を変えると、ちがうお話になります。</p><div class="nav"><a class="btn-like" href="../../"><button class="go">性格を選びなおす</button></a></div><p><a href="./?cast='+q.join(',')+'">もう一度見る</a></p>';$('cover').querySelector('.load').hidden=true;}
 setTimeout(tick,300);}
show();tick();
</script><header><div><h1>三びきのこぶた — それぞれの家づくり</h1><span id="variant">家づくり・歩く狼・びっくりして逃げるこぶた</span><small>草地と庭、三軒の家、森へ続く道</small></div><small>ドラッグで周回 · 右ドラッグで移動 · ホイールで距離 · WASDでカメラ移動</small></header><main><canvas tabindex="0" aria-label="自由に動かせる3Dの村"></canvas><div id="intro-card" hidden></div><div id="loading">3Dの村を読み込んでいます…</div><div id="village-overlay" hidden><p id="village-message"></p><button id="village-cancel">準備を取り消す</button></div><div id="story-cut" aria-hidden="true"></div><div id="story-caption" role="status" aria-live="polite" hidden></div><div id="story-effect" aria-hidden="true"></div><output id="stats" aria-live="off"></output></main><div class="controls"><button id="village-open" disabled>三軒の村を開く</button><output id="village-state">藁の家の庭</output><button data-travel="straw" disabled>藁の家へ移動</button><button data-travel="wood" disabled>木の家へ移動</button><button data-travel="brick" disabled>レンガの家へ移動</button><select aria-label="視点" id="view"><option value="hero">庭と家</option><option value="front">正面</option><option value="right">右側</option><option value="back">背面</option><option value="left">左側</option><option value="low">低い視点</option><option value="top">上から</option><option value="forest">森の近く</option><option value="distant">遠くから</option><option data-village disabled value="village">村全体</option><option data-village disabled value="village_top">三軒を上から</option><option data-village disabled value="wood_front">木の家 正面</option><option data-village disabled value="wood_back">木の家 背面</option><option data-village disabled value="wood_left">木の家 左側</option><option data-village disabled value="wood_right">木の家 右側</option><option data-village disabled value="wood_low">木の家 低い視点</option><option data-village disabled value="brick_front">レンガの家 正面</option><option data-village disabled value="brick_back">レンガの家 背面</option><option data-village disabled value="brick_left">レンガの家 左側</option><option data-village disabled value="brick_right">レンガの家 右側</option><option data-village disabled value="brick_low">レンガの家 低い視点</option><option data-village disabled value="compare_top">比較：村全体を俯瞰</option><option data-village disabled value="acting_front">演出：藁の家へ接近</option><option data-village disabled value="acting_low">演出：木の家へ低く接近</option><option data-village disabled value="between_houses">演出：家同士の空間</option><option data-village disabled value="front_gate">外周：正面の連続柵</option><option data-village disabled value="rear_gate">外周：背面の連続柵</option><option data-village disabled value="left_gate">外周：左の道路入口</option><option data-village disabled value="right_gate">外周：右の道路入口</option><option data-village disabled value="perimeter_back">外周：後ろから</option><option data-character-view disabled value="character_front">キャラ：正面</option><option data-character-view disabled value="character_back">キャラ：背面</option><option data-character-view disabled value="character_west">キャラ：西から</option><option data-character-view disabled value="character_east">キャラ：東から</option><option data-character-view disabled value="character_diagonal">キャラ：斜め</option><option data-character-view disabled value="character_low">キャラ：低い目線</option><option data-character-view disabled value="character_overhead">キャラ：俯瞰未対応の確認</option><option data-character-view disabled value="character_house_occlusion">キャラ：家の遮蔽</option><option data-character-view disabled value="character_fence_occlusion">キャラ：柵の遮蔽</option></select><button id="orbit" aria-pressed="false">360度周回</button><button id="walk" aria-pressed="false">庭をカメラ移動</button><button id="collapse" disabled>藁の家の崩壊を再生</button><button id="reset" disabled>元に戻す</button><output id="animation-state">静的外観</output><button id="measure" disabled>10秒計測</button><button id="save" disabled>検証画像を保存</button><small>Mac上で検証。実機スマホ性能は未確認。</small></div><section class="controls" aria-label="2Dキャラ内部検証"><button id="character-load" disabled>2Dキャラ4体を配置</button><button id="character-orbit" data-character-control disabled aria-pressed="false">4体の周囲を回る</button><button id="character-occlusion" data-character-control disabled>家・柵の遮蔽配置</button><button id="character-translate" data-character-control disabled>移動だけの技術試験</button><button id="character-pause" data-character-control disabled>移動を停止</button><label>試験時間 <input id="character-time" data-character-control type="range" min="0" max="10" step=".1" value="0" disabled></label><output id="character-state">三軒の村を開いた後に配置できます。建築・狼の歩行・こぶたの逃走は物語の中で再生します。人物の俯瞰表示は未対応です。</output></section><section id="story-controls" class="controls" aria-label="三びきのこぶたの物語"><strong>三びきのこぶた · 150秒</strong><button id="story-play" disabled>再生</button><button id="story-pause" disabled>一時停止</button><button id="story-reset" disabled>先頭へ戻す</button><label>場面 <select id="story-scene" disabled></select></label><label>時間 <input id="story-time" type="range" min="0" max="150" step=".1" value="0" disabled></label><button id="story-camera" aria-pressed="true" disabled>自由カメラへ</button><button id="story-inspect">検証操作を開く</button><span id="story-audio-controls" hidden><label>効果音音量 <input id="story-volume" aria-label="効果音音量" type="range" min="0" max="1" step=".01" value=".18"></label><label><input id="story-mute" type="checkbox">ミュート</label></span><output id="story-state">再生すると村と画像を準備します。字幕付きの絵本劇。自由カメラへ切り替えることもできます。</output></section><pre id="report"></pre><script type="module" src="./viewer.js"></script></html>
