<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>同じ背景から、二つのお話</title><link rel="stylesheet" href="style.css"></head><body>
<main><header><span class="eyebrow">三びきのこぶた · 軽量版の比較</span><h1>同じ背景から、二つのお話。</h1><p>前半12秒は同じ素材。アングルが変わるところで、結末が分かれます。</p></header>
<p class="back"><a href="../layered-story/">声つき原作版「三匹が助かるお話」を見る（約4分30秒）</a></p>
<div class="choices" role="group" aria-label="見たいお話"><button id="hold" aria-pressed="true">① 家を守り切る <small>21秒</small></button><button id="escape" aria-pressed="false">② 裏口から逃げる <small>21秒</small></button></div>
<section class="player" aria-label="お話の再生"><div class="picture"><canvas width="960" height="540" aria-label="背景画像と2Dキャラクターのお話"></canvas><span id="part">共通の場面</span><div id="loading" role="status">画像を準備しています…</div></div><p id="caption">狼が家へ息を吹きつけます。</p>
<div class="controls"><button id="play" disabled>再生</button><button id="both" disabled>2通りを続けて見る</button><label class="sound"><input id="sound" type="checkbox" checked>音あり</label></div><div class="seek"><label for="time">再生位置</label><input id="time" type="range" min="0" max="21" step="0.05" value="0"><output id="clock">0:00 / 0:21</output></div></section>
<div class="foot"><p id="status" aria-live="polite">① 家を守り切る</p><label><input id="background" type="checkbox">背景だけを見る</label></div>
<details><summary>何を共用しているか</summary><p>前半3カットの背景と動きは、どちらも同じファイルです。後半は室内・裏口・玄関へ切り替え、違う動きを重ねます。再生に3D処理は使いません。</p><p id="size"></p><p>音は共通の背景音です。台詞は字幕で表示します。</p></details>
<p class="back"><a href="../?mode=strategy">本編の性格選択へ</a></p></main><audio id="audio" src="/three-pigs/play/web_J38/audio/ending_bed.m4a" preload="none" loop></audio><script type="module" src="player.js"></script></body></html>
